services:
  neo4j:
    image: neo4j:5.18-community
    environment:
      NEO4J_AUTH: "neo4j/fadexadex"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_pagecache_size: "1G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./personas.db:/app/personas.db:ro
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./ui:/app
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  neo4j_data:
